# CI 门禁（2026-09-14 接入）：PR 与 main 的每次 push 都会执行
#
#   backend  —— 全量用例（vendor 不入库，按 requirements.txt 安装；Linux 下 PYTHONPATH 分隔符是冒号）
#   gates    —— 三道静态门禁：密钥扫描 + 用户可见文案门禁 + 文档一致性（退出码必须为 0）
#   autofix  —— gates 失败时对「确定性计数」自动跑 --fix 并推回 PR 分支（仅同仓库 PR）
#   web      —— tsc 类型检查 + next build
#
# 启用强制门禁：仓库 Settings → Branches → main 分支保护 →
#   勾选 Require status checks → 选中 backend / gates / web 三个 check。
# autofix 需要写权限：Settings → Actions → General → Workflow permissions 勾
#   Read and write permissions（否则只推不动，日志里报错，不影响其它 job）。
# 部署不受影响：仍是服务器 05:00 拉 main（CI 只把关 PR 合入）。
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: backend (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: 测试
        env:
          PYTHONPATH: 'vendor:.'        # Linux 分隔符是冒号（本地 Windows 为分号）
          RETRIEVAL_BACKEND: inmemory
        run: python -m pytest -q

  gates:
    name: gates (secrets + ui-copy + doc-sync)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: 密钥门禁（退出码必须 0）
        run: python reviewer/scan_secrets.py
      - name: 用户可见文案门禁（退出码必须 0）
        run: python reviewer/scan_ui_copy.py
      # 文档门禁要用 pytest 真收集才算得出用例数，故装后端依赖（与 backend job 同 cache）。
      - name: 安装后端口径依赖
        run: python -m pip install -r backend/requirements.txt
      # 文档与代码一致性（计数/迁移数/工具数/结构/悬空路径/编码/过期表述）。
      # 判定真值 = git 索引：**本地跑 == CI 跑**（2026-09-16 PR #29「本地绿、CI 红」的根因修复）。
      # 依赖没装齐时用例数一项自动 WARN 跳过，其余检查照常生效。
      - name: 文档一致性门禁（退出码必须 0）
        working-directory: backend
        env:
          PYTHONPATH: 'vendor:.'        # Linux 分隔符是冒号（本地 Windows 为分号）
          RETRIEVAL_BACKEND: inmemory
        run: python ../skills/doc_sync_check.py

  web:
    name: web (tsc + build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      # 前端用 pnpm（deploy/frontend.Dockerfile 同款：pnpm install --frozen-lockfile）
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '22'    # 与 deploy/frontend.Dockerfile 对齐（生产 node:22）
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit
      - run: pnpm run build

  # 自动修复（2026-09-16 接入）：gates 失败且是**同仓库 PR** 时，用 `--fix` 自愈「确定性计数」
  # （用例数/迁移数/工具 schema 数），有改动就作为新提交推回 PR 分支；下一轮 CI 复跑确认转绿。
  # 判读类 FAIL（悬空引用/过期表述/环境变量/README 结构）**不自动改**——按 skills/doc-sync.md
  # 人工对齐，避免「改文档骗过门禁」。fork 的 PR 推不动，本 job 直接跳过。
  autofix:
    name: autofix (doc-sync --fix → PR branch)
    needs: gates
    if: >-
      failure() && github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r backend/requirements.txt
      # 防循环保险：上一提交已是 autofix 产物就不再叠加（--fix 是收敛的，正常不会有第二轮）
      - name: 防循环判定
        id: guard
        run: |
          if git log -1 --pretty=%s | grep -q 'doc-sync 自动修复'; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: 自愈确定性计数（打印每条改写）
        if: steps.guard.outputs.skip != 'true'
        working-directory: backend
        env:
          PYTHONPATH: 'vendor:.'
          RETRIEVAL_BACKEND: inmemory
        run: |
          set -o pipefail
          # 退出码 1 = 仍有判读类 FAIL（悬空引用等）：计数已自愈，继续推补丁，剩余问题留给人/Agent；
          # >1 才是脚本异常，直接失败。
          python ../skills/doc_sync_check.py --fix 2>&1 | tee /tmp/doc-sync-fix.log || rc=$?
          rc=${rc:-0}
          if [ "$rc" -gt 1 ]; then exit "$rc"; fi
      - name: 有补丁才推回 PR 分支
        if: steps.guard.outputs.skip != 'true'
        run: |
          if git diff --quiet; then
            echo "无可自愈改动（--fix 未改写任何计数），不推送"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u -- '*.md'   # 只提交 --fix 改写的已跟踪文档（不是 add -A）
          git commit -m 'docs(sync): doc-sync 自动修复确定性计数（CI autofix）' \
            -m "$(grep '^FIX' /tmp/doc-sync-fix.log || echo '明细见 autofix job 日志')"
          git push origin "HEAD:${{ github.head_ref }}"
