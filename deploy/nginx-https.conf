# carSelection nginx 反向代理（80/443 → 前端 3000；/api 直连后端 8000）
# 放置到 /etc/nginx/conf.d/carsel.conf 后 nginx -t && systemctl reload nginx
# ICP 备案号在 web 页脚由环境变量 ICP_NUMBER 注入（备案通过后设置）
#
# 关键（2026-09-09 线上实测教训）：/api 绝不能经 web 容器的 Next.js rewrite 转发——
# Node 代理层对 Agent 的 LLM 长请求（30~90s）会中途放弃返回 500，且挂死时把经它
# 的其他 API 请求（admin 等）连锁拖死。必须由 nginx 直连后端；SSE 端点关缓冲。
server {
    listen 443 ssl;
    ssl_certificate /etc/nginx/certs/carsel-fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/carsel-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    server_name hp-car-selection-assistant.cn www.hp-car-selection-assistant.cn;

    client_max_body_size 8m;

    # ACME HTTP-01 验证目录（acme.sh webroot 模式）
    location ^~ /.well-known/acme-challenge/ {
        default_type "text/plain";
        root /var/www/acme;
    }

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # ── 管理入口不对公网开放（2026-09 加固）────────────────────────────────
    # 只有从本机（127.0.0.1，即 SSH 隧道）访问才放行，公网一律 403。
    # 原因：管理凭据是静态 Bearer token，认证的是「凭据」而不是「人」。
    # 用法：ssh -i .deploy/ecs_key -L 8080:127.0.0.1:3000 root@<server>
    #       浏览器打开 http://127.0.0.1:8080/ops/rag
    location /api/v1/admin/ {
        allow 127.0.0.1;
        allow ::1;
        deny all;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location /ops/ {
        allow 127.0.0.1;
        allow ::1;
        deny all;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── API 直连后端（不走 web 容器） ──
    location /api/v1/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Agent 对话含多轮 LLM 调用，30-90s 常态
        proxy_connect_timeout 10s;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    # SSE 流式端点：关缓冲、长连接
    location ~ ^/api/v1/agent/sessions/[^/]+/stream$ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_read_timeout 600s;
    }

    # 前端（Next.js 动态渲染）
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Next 静态资源长缓存
        location /_next/static/ {
            proxy_pass http://127.0.0.1:3000;
            proxy_cache_valid 200 30d;
            add_header Cache-Control "public, max-age=2592000, immutable";
        }
    }
}
