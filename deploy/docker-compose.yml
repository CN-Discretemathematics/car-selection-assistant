# carSelection 生产部署（PROJECT_PLAN.md 阶段 2 云端架构）
#
# 用法（服务器上，仓库根目录）：
#   1) 准备 backend/.env（生产值：数据库、Redis、OSS、SMTP 与管理凭据，见 .env.example）
#   2) docker compose -f deploy/docker-compose.yml up -d --build
#   3) nginx 用 deploy/nginx.conf 反代 80/443 → 前端 3000（/api 已由前端容器内部转回后端）
#
# 注：数据库/Milvus/OSS 为云托管；Redis 为本机容器（会话/限流/验证码存储）
services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # 会话/限流/认证令牌均带 TTL（令牌 TTL 最长 30 天）：
    # - 无持久化：redis 重启 = 全量登出 + 限流计数清零（可接受，重启罕见）
    # - volatile-lru：只淘汰带 TTL 的键（所有键均带 TTL），优先最旧
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "volatile-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  api:
    build:
      context: ..
      dockerfile: deploy/backend.Dockerfile
    restart: unless-stopped
    env_file:
      - ../backend/.env
    environment:
      # 默认单 worker：Redis 不可用时认证/会话回退进程内，多 worker 会分裂脑（评审 M8）
      UVICORN_WORKERS: ${API_WORKERS:-1}
      # 评审 R4#9：显式接线（默认指向 compose 内 redis，.env 同名变量可覆盖）
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    volumes:
      # embedding 向量缓存 / dense 构建水位标记持久化：容器重建不丢（2026-09-10）
      - ../backend/.tmp:/srv/carsel/backend/.tmp
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      # 就绪探针（真实探测数据库）：与 /health 存活探针区分——数据库不可用时不报健康，
      # 避免 web 在依赖已挂的情况下照常启动（安全评审 #24）
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/api/v1/ready', timeout=5)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    # 容器加固（安全评审 #22/#28）：禁提权、丢全部能力、限制内存与进程数
    # （服务监听 8000 > 1024，无需任何 capability）
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 1200m
    pids_limit: 512

  web:
    build:
      context: ..
      dockerfile: deploy/frontend.Dockerfile
      args:
        # 构建期固化浏览器端 /api 转发目标为 api 服务（评审 N1）
        BACKEND_URL: http://api:8000
    restart: unless-stopped
    environment:
      # 服务端渲染调用后端（容器内直连 api 服务）
      BACKEND_URL: http://api:8000
    ports:
      - "127.0.0.1:3000:3000"
    # 容器加固（同 api）
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 900m
    pids_limit: 512
    depends_on:
      api:
        condition: service_healthy
